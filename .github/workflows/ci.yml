# bin/check.sh is the whole deterministic contract: index currency, the portable
# skill lint (proven to bite on a fixture), version agreement across
# package.json / plugin.json / marketplace entry, the root pi manifest against
# skill scopes, hook manifests against the contract's event list, content-module
# wiring (empty dsh patch, hooks paths, pi globs), `claude plugin validate`, the
# version-bump check against main, the private-path grep, every module's tests,
# and the conformance suites (the invariant that no module ships dsh or pi
# code — that lives in the dotfiles harness layer as foundation now).
#
# `smoke` goes one step further and installs the real harnesses from npm: pi
# must load the repo as a package and resolve its portable skills; dsh must
# install a content module into a scratch profile, honor the empty
# cordis.patch.yml convention, and apply every installed plugin that ships
# code. This is the layer that catches "registers nothing" bugs the unit
# tests cannot see, so it is a separate job: a harness install hiccup must not
# mask the deterministic gate.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
      - name: Install the Claude Code CLI (for `claude plugin validate`)
        run: npm install -g @anthropic-ai/claude-code
      - name: bin/check.sh
        run: CHECK_BASE=origin/main ./bin/check.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pi and dsh from npm
        run: npm install -g @earendil-works/pi-coding-agent @deepseek-ai/dsh
      - name: pi loads the repo as a package and resolves its portable skills
        run: bash tests/smoke/pi.sh
      - name: dsh installs a content module into a scratch profile and every plugin applies
        run: bash tests/smoke/dsh.sh

  # A tag is the install ref: `pi install …@vX.Y.Z` and dsh's `#vX.Y.Z` resolve to
  # one. So a tag is cut exactly when the content those commands deliver changed —
  # any file under modules/. A docs, CI or repo-skill merge ships nothing to a user
  # and gets no tag; replaying this rule over every merge to date reproduces both
  # deliberate skips (#7, #10).
  #
  # The number comes from the newest v* tag, not from a version field. Root
  # package.json has never agreed with the tags (v0.2.1 sits on root 0.2.0) and
  # nothing reads it as a release version — bin/check.sh only enforces the
  # per-module versions. Patch is the only automatic step: to move the minor or
  # major, push that tag by hand and the next automatic tag continues from it.
  tag:
    needs: [check, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the repo default is read, and only this job needs more
    concurrency:
      group: tag-main # queue merges that land together; never cancel a tag push
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the default depth of 1 hides every existing tag

      - name: Tag when this push changed modules/
        run: |
          set -euo pipefail

          # github.event.before is the previous tip of main, but it is unusable on a
          # first push (all zeros) and after history rewrites; the merge commit's
          # first parent is the same thing for a merge or squash landing on main.
          before='${{ github.event.before }}'
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            before="$(git rev-parse HEAD^1)"
          fi

          if git diff --quiet "$before" HEAD -- modules; then
            echo "No change under modules/ between $before and HEAD — nothing to release."
            exit 0
          fi

          # sed, not head: head closes the pipe early and SIGPIPEs git once there
          # are enough tags to fill the buffer, which pipefail turns into a failure.
          latest="$(git tag -l 'v[0-9]*' --sort=-v:refname | sed -n 1p)"
          [ -n "$latest" ] || latest="v0.0.0"
          ver="${latest#v}"
          major="${ver%%.*}"; rest="${ver#*.}"; minor="${rest%%.*}"; patch="${rest#*.}"
          next="v${major}.${minor}.$((patch + 1))"

          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "::warning::${next} already exists; refusing to move it."
            exit 0
          fi

          echo "modules/ changed — ${latest} -> ${next}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "$next — $(git log -1 --pretty=%s)"
          git push origin "$next"
