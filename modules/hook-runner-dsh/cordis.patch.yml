# @allada-homelab/hook-runner-dsh bundle patch.
#
# One loader row. The plugin registers listeners on five existing seams — no
# services, no tool schemas, no static system-prompt text — so a profile with no
# hook-carrying module installed pays nothing per turn.
#
# `manifests` is empty by default: the runner auto-discovers every bundle in the
# profile's own `dsh.profile.bundles` that ships `hooks/hooks.json`. Set it to
# absolute hooks.json paths or module directories to pin the set explicitly
# (config-managed fleets), which is unioned with auto-discovery.
- insert:
    - id: hook-runner-dsh
      name: '@allada-homelab/hook-runner-dsh'
      config:
        manifests: []
